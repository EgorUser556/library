<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Discover books and save your favorite reads." />
    <title>The Library</title>
  </head>
  <body>
    <header class="header">
      <div class="container header-inner">
        <span class="brand-icon"></span>
        <span class="brand-text">
          <span class="brand-name">The Library</span>
          <span class="brand-tagline">Discover your next favorite book</span>
        </span>
      </div>
    </header>
    <main class="main-content" id="main-content">
      <section class="search-section">
        <div class="container">
          <h1 class="search-title" id="search-title">Discover Your Next Great Read</h1>
          <p class="search-description">
            Search millions of books, build your personal library, and never lose track of what to
            read next.
          </p>
          <form class="search-form">
            <input
              class="search-input"
              id="search-input"
              type="search"
              placeholder="Search for books by title or author..."
              required
            />
            <button class="search-button" type="submit">Search</button>
          </form>
        </div>
      </section>
    </main>
  </body>
</html>
