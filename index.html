<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Discover books and save your favorite reads." />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&amp;family=Source+Sans+3:wght@300;400;500;600&amp;display=swap"
      rel="stylesheet"
    />
    <title>The Library</title>
  </head>
  <body>
    <header class="header">
      <div class="container header-inner">
        <span class="brand-icon"></span>
        <span class="brand-text">
          <span class="brand-name">The Library</span>
          <span class="brand-tagline">Discover your next favorite book</span>
        </span>
      </div>
    </header>
    <main class="main-content" id="main-content">
      <section class="search-section">
        <div class="container">
          <h1 class="search-title" id="search-title">Discover Your Next Great Read</h1>
          <p class="search-description">
            Search millions of books, build your personal library, and never lose track of what to
            read next.
          </p>
          <form class="search-form" novalidate>
            <input
              class="search-input"
              id="search-input"
              type="search"
              placeholder="Search for books by title or author..."
            />
            <button class="search-button" type="submit">Search</button>
          </form>
          <p class="search-validation" id="search-validation"></p>
        </div>
      </section>
      <div class="container library-layout">
        <section class="books-section">
          <div class="books-toolbar" id="books-toolbar" hidden>
            <div class="filter">
              <label class="filter-label" for="filter">Author:</label>
              <select class="filter-select" id="filter">
                <option value="">All authors</option>
              </select>
            </div>
          </div>
          <div class="search-status" id="search-status"></div>
          <div class="books-grid" id="books-grid"></div>
        </section>
        <aside class="favorites-panel">
          <div class="favorites-header">
            <h2 class="favorites-title">Favorites</h2>
            <p class="favorites-count" id="favorites-count"></p>
          </div>
          <div class="favorites-list" id="favorites-list"></div>
        </aside>
      </div>
    </main>
    <footer class="footer">
      <div class="container">
        <p class="footer-text">
          Powered by
          <a class="footer-link" href="https://openlibrary.org/">Open Library</a>
        </p>
      </div>
    </footer>
  </body>
</html>
